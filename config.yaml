# =============================================================================
# RAG 파이프라인 전체 설정
# -----------------------------------------------------------------------------
# - 로드 우선순위: `--config` 인자 → 환경변수 RAG_CONFIG → ./config.yaml → 코드 기본값(rag/config.py)
# - 항목을 지우면 코드 기본값이 쓰입니다. 모르는 키(오타)가 있으면 실행 시 오류로 알려 줍니다.
# - API 키는 여기에 넣지 마세요. 프로젝트 루트의 .env 파일에 ANTHROPIC_API_KEY로 넣습니다 (.env.example 참고).
# =============================================================================


# -----------------------------------------------------------------------------
# 1. 파서 (PDF / Excel / Word → Markdown)
# -----------------------------------------------------------------------------
parser:
  # --- PDF 라우팅 ---
  large_pdf_page_threshold: 300    # 이 페이지 수 초과 → Docling 건너뛰고 PyMuPDF4LLM(고속)
  large_pdf_size_mb: 50.0          # 이 크기(MB) 초과 → PyMuPDF4LLM(고속)
  use_docling: true                # false면 모든 PDF/DOCX를 경량 파서로 처리
  docling_timeout_sec: 600.0       # Docling 문서 1건당 최대 처리 시간
  scanned_chars_per_page: 50       # 페이지당 평균 글자 수가 이보다 적으면 스캔 PDF로 보고 OCR
  preflight_sample_pages: 10       # 스캔 여부 판단에 쓰는 샘플 페이지 수
  min_docling_text_ratio: 0.5      # Docling 결과가 원문 텍스트의 이 비율 미만이면 누락으로 보고 Fallback

  # --- Excel ---
  excel_force_narrative: false     # true면 모든 시트를 "[행N] 열: 값" 서술형으로 변환
  excel_max_header_rows: 3         # 다단 헤더로 인정할 최대 행 수
  excel_include_hidden_sheets: false


# -----------------------------------------------------------------------------
# 2. 청커 (Parent / Child)
# -----------------------------------------------------------------------------
chunker:
  headers_to_split_on:             # 1차 분할 기준 헤더 (#### 이하는 섹션 내부로 취급)
    - ["#", "h1"]
    - ["##", "h2"]
    - ["###", "h3"]
  parent_max_chars: 3000           # Parent(LLM에 전달되는 단위) 최대 글자 수
  parent_min_chars: 800            # 이보다 작은 섹션은 같은 장 안에서 인접 섹션과 병합
  child_chunk_chars: 500           # Child(검색 단위) 크기 — 메타데이터 태그 길이 포함
  child_overlap_chars: 50          # 긴 문단을 자를 때만 적용되는 겹침
  min_child_body_chars: 150        # 태그가 길어도 본문에 최소 이만큼은 확보
  min_child_chars: 10              # 공백 제외 이보다 짧은 Child는 버림 (페이지 번호 조각 등)
  table_caption_max_chars: 150     # 표 바로 앞 문단이 이 길이 이하면 표 캡션으로 모든 조각에 복사
  default_section: "본문"          # 헤더가 없는 문서의 섹션명
  max_section_label_items: 3       # 병합 Parent 라벨에 나열할 소섹션 수


# -----------------------------------------------------------------------------
# 3. 인덱스 저장소 (Chroma + Docstore + BM25 + 매니페스트)
# -----------------------------------------------------------------------------
store:
  persist_dir: "./store"
  collection_name: "rag_children"
  # 임베딩 모델을 바꾸면 기존 인덱스와 벡터 공간이 달라지므로 persist_dir을 비우고 재인덱싱해야 합니다.
  embedding_model: "BAAI/bge-m3"
  embedding_device: null           # null=자동(cuda > mps > cpu), 또는 "cpu" / "cuda" / "mps"
  add_batch_size: 256


# -----------------------------------------------------------------------------
# 4. 하이브리드 검색 (Dense + BM25 → RRF → Parent)
# -----------------------------------------------------------------------------
retriever:
  dense_k: 20                      # 벡터 검색 Child 후보 수
  sparse_k: 20                     # BM25 Child 후보 수
  rrf_k: 60                        # RRF 상수 (클수록 순위 차이가 완만)
  dense_weight: 0.5                # 제품코드·수치 질의가 많으면 sparse_weight를 올리세요
  sparse_weight: 0.5
  top_n: 5                         # LLM에 전달할 Parent 수


# -----------------------------------------------------------------------------
# 5. 답변 생성 (Claude)
# -----------------------------------------------------------------------------
# 모델을 바꿀 때는 아래 세 항목도 함께 맞춰야 합니다 (잘못된 조합은 실행 시 바로 알려 줍니다).
#
#   model               effort              temperature   enable_refusal_fallback
#   claude-haiku-4-5    null                0.0           false
#   claude-sonnet-5-5   "medium" / "high"   null          true
#   claude-opus-5-5     "medium" / "high"   null          true
generation:
  model: "claude-haiku-4-5"
  effort: null
  temperature: 0.0                 # 0 = 같은 질문에 최대한 같은 답 (사실 기반 RAG에 적합)
  max_tokens: 4096                 # 답변 최대 토큰
  max_retries: 3                   # 429 / 5xx / 네트워크 오류 자동 재시도 횟수 (SDK 내장)
  timeout_sec: 120.0
  enable_refusal_fallback: false
  max_context_chars: 24000         # LLM에 넣는 Parent 본문 합계 상한 (넘치면 하위 문서를 통째로 제외)
